plugins {
    id "architectury-plugin" version "3.5.169"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
}

architectury {
    minecraft = "26.3"
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    group = maven_group
    version = "1.0.5-26.3"

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://api.modrinth.com/maven" }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
        systemProperty "minecraft.username", rootProject.properties.getOrDefault("minecraft_username", "Player")
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    base {
        archivesName = "mmdskin-${project.name}"
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}
