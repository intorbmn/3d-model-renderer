plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

allprojects {
    apply plugin: "java"

    group = maven_group
    version = "1.0.0-26.3"

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://api.modrinth.com/maven" }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
        // javac stops at 100 errors by default; list everything so the port can be enumerated.
        options.compilerArgs.addAll(["-Xmaxerrs", "100000", "-Xmaxwarns", "100000"])
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
        systemProperty "minecraft.username", rootProject.properties.getOrDefault("minecraft_username", "Player")
    }
}

subprojects {
    apply plugin: "net.fabricmc.fabric-loom"

    base {
        archivesName = "3d-model-renderer-${project.name}"
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}
