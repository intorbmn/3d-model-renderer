name: MPR Rust JNI smoke test

on:
  push:
    branches:
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-jni-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Rust submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux x64 native library
        run: cargo build --release --manifest-path rust_engine/Cargo.toml

      - name: Load the native library and call GetVersion (no Minecraft needed)
        run: bash ci/jni-smoke/run.sh
