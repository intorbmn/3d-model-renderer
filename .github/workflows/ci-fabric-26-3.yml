name: MPR Fabric 26.3 Java compile check

on:
  push:
    branches:
      - 'port/**'
  pull_request:
    branches:
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile Java modules without building Rust
        run: ./gradlew :common:compileJava :fabric:compileJava --no-daemon -x prepareNativeResources -x buildRustNative --stacktrace

      - name: Upload compile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpr-fabric-26.3-compile-reports
          path: |
            common/build/reports/**
            fabric/build/reports/**
          if-no-files-found: ignore
