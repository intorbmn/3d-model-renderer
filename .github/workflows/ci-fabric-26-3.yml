name: MPR Fabric 26.3 Java compile check

on:
  push:
    branches:
      - 'port/**'
  pull_request:
    branches:
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile Java modules without building Rust
        run: ./gradlew :common:compileJava :fabric:compileJava --no-daemon -x prepareNativeResources -x buildRustNative --stacktrace

      # Compiling never checks Mixin string targets ("method = ...", "target = ..."), so a
      # green compile can still crash at game start. This checks them against the real jar.
      - name: Mixin validator self-test
        if: always()
        run: ci/mixin-check/selftest.sh

      - name: Validate Mixin targets against the Minecraft 26.3 jar
        if: always()
        run: |
          JAR=$(find "$HOME/.gradle" -type f -name 'minecraft-merged*.jar' ! -name '*sources*' | head -1)
          if [ -z "$JAR" ]; then echo "Minecraft jar not found; the compile step did not resolve it"; exit 1; fi
          echo "Using $JAR"
          LIBS=$(find "$HOME/.gradle/caches/modules-2" -type f -name '*.jar' ! -name '*sources*' 2>/dev/null | paste -sd:)
          python3 ci/mixin-check/check_mixins.py \
            --src fabric/src/main/java \
            --mixins-json fabric/src/main/resources/mmdskin-fabric.mixins.json \
            --classpath "$JAR:$LIBS" \
            --summary "$GITHUB_STEP_SUMMARY" --quiet-ok

      - name: Render API for the submit-based backend (readable in the run summary)
        if: always()
        run: |
          JAR=$(find "$HOME/.gradle" -type f -name 'minecraft-merged*.jar' ! -name '*sources*' | head -1)
          [ -n "$JAR" ] || { echo "Minecraft jar not found"; exit 0; }
          LIBS=$(find "$HOME/.gradle/caches/modules-2" -type f -name '*.jar' ! -name '*sources*' 2>/dev/null | paste -sd:)
          { echo "## Minecraft 26.3 render API"; echo; ci/dump-render-api.sh "$JAR" "$LIBS"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect Minecraft 26.3 API (diagnostic)
        if: always()
        run: |
          set +e
          echo "== candidate Minecraft jars"
          find ~/.gradle -type f -name '*.jar' -path '*minecraft*' ! -name '*sources*' -size +5M 2>/dev/null | head -5
          for jar in $(find ~/.gradle -type f -name '*.jar' -path '*minecraft*' ! -name '*sources*' -size +5M 2>/dev/null | head -3); do
            echo "== $jar"
            unzip -Z1 "$jar" | grep -E '^(com/mojang/blaze3d/(vertex|platform|systems|pipeline|buffers)/[A-Za-z]+\.class|net/minecraft/client/gui/[A-Za-z]+\.class|net/minecraft/client/renderer/[A-Za-z]+\.class|net/minecraft/client/(player|input)/[A-Za-z]+\.class)$' | sed 's/\.class$//' | sort
          done
          echo "== lwjgl / sdl jars"
          find ~/.gradle -type f \( -name 'lwjgl*.jar' -o -name '*sdl*.jar' \) ! -name '*sources*' 2>/dev/null | sed 's#.*/##' | sort -u | head -60

      - name: Dump public API of key Minecraft 26.3 classes (diagnostic)
        if: always()
        run: |
          set +e
          JAR=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          for c in \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.Minecraft \
            net.minecraft.client.KeyMapping \
            com.mojang.blaze3d.platform.InputConstants \
            com.mojang.blaze3d.platform.Window \
            com.mojang.blaze3d.vertex.PoseStack \
            com.mojang.blaze3d.vertex.VertexConsumer \
            com.mojang.blaze3d.vertex.BufferBuilder \
            com.mojang.blaze3d.systems.RenderSystem \
            net.minecraft.client.renderer.GameRenderer \
            net.minecraft.client.renderer.RenderPipelines \
            net.minecraft.client.renderer.entity.EntityRenderer \
            net.minecraft.client.renderer.entity.LivingEntityRenderer \
            net.minecraft.client.renderer.entity.player.AvatarRenderer \
            net.minecraft.client.renderer.entity.EntityRendererProvider \
            net.minecraft.client.player.FirstPersonHandsAndItems \
            net.minecraft.client.renderer.FirstPersonHandsAndItemsRenderer \
            net.minecraft.client.player.ClientInput \
            net.minecraft.client.player.KeyboardInput \
            net.minecraft.client.input.KeyEvent \
            net.minecraft.client.input.MouseButtonEvent \
            net.minecraft.client.Camera \
            net.minecraft.client.MouseHandler; do
            echo "##### $c"
            javap -public -cp "$JAR" "$c" 2>&1 | head -150
          done
          echo "##### classes named like Renderer for players / vertex format / item use"
          unzip -Z1 "$JAR" | grep -E '(PlayerRenderer|AvatarRenderer|VertexFormat|ItemUseAnimation|UseAnim|ResourceLocation|Identifier)\.class$' | head -20

      - name: Look up renamed Minecraft and Fabric API members (diagnostic)
        if: always()
        run: |
          set +e
          JAR=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          FJARS=$(find $HOME/.gradle -type f -name 'fabric-*.jar' ! -name '*sources*' ! -name '*loom*' 2>/dev/null)
          FCP=$(echo "$FJARS" | paste -sd:)
          show() {
            echo "##### $1  /$2/"
            javap ${4:--public} -cp "$JAR:$FCP" "$1" 2>&1 | grep -E "$2" | cut -c1-230 | head -${3:-60}
          }
          full() {
            echo "##### $1 (full)"
            javap ${3:--public} -cp "$JAR:$FCP" "$1" 2>&1 | cut -c1-230 | head -${2:-80}
          }
          echo "##### fabric api module jars"
          echo "$FJARS" | sed 's#.*/##' | sort -u | head -80
          echo "##### fabric api classes of interest"
          for j in $FJARS; do unzip -Z1 "$j" 2>/dev/null | grep -E '(KeyBind|KeyMapping|HudElement|HudRender|PayloadTypeRegistry|ClientPlayNetworking|ServerPlayNetworking|EntityRendererRegistry|EntityRenderers)[A-Za-z$]*\.class$'; done | sort -u | head -50 | tee /tmp/fapi-classes.txt
          for c in $(sed -e 's#\.class$##' -e 's#/#.#g' /tmp/fapi-classes.txt | grep -vE '\$' | head -16); do
            full "$c" 45
          done
          show net.minecraft.client.multiplayer.MultiPlayerGameMode 'ange|ick|Reach' 12
          full net.minecraft.world.entity.player.Input 25
          show net.minecraft.client.player.ClientInput '.' 20 -protected
          show net.minecraft.core.registries.BuiltInRegistries 'ENTITY_TYPE' 5
          show net.minecraft.core.Registry 'getOptional|containsKey|getValue|get\(' 12
          full me.shedaniel.clothconfig2.api.AbstractConfigListEntry 45
          show net.minecraft.client.gui.components.AbstractWidget 'xtract|render' 12

      - name: Upload compile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpr-fabric-26.3-compile-reports
          path: |
            common/build/reports/**
            fabric/build/reports/**
          if-no-files-found: ignore
