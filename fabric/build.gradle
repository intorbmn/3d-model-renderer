// Fabric platform dependencies and release packaging.

loom {
	mods {
		"mmdskin" {
			sourceSet sourceSets.main
			sourceSet("main", project(":common"))
		}
	}

	runs {
		client {
			client()
			name "Fabric Client"
			runDir "run/client"
			programArgs "--username", "Player1"
			vmArgs "-Xmx2G", "-Xms1G"
		}
		client2 {
			client()
			name "Fabric Client 2"
			runDir "run/client2"
			programArgs "--username", "Player2"
			vmArgs "-Xmx2G", "-Xms1G"
		}
		server {
			server()
			name "Fabric Server"
			runDir "run/server"
		}
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
	// Sodium 和 Iris 的 Maven 仓库
	maven {
		url "https://maven.terraformersmc.com/releases/"
		name "TerraformersMC"
	}
	// Iris Maven
	maven {
		url "https://maven.irisshaders.dev"
		name "Iris Shaders"
	}
	// Cardinal Components API (Ladysnake)
	maven {
		url "https://maven.ladysnake.org/releases"
		name "Ladysnake"
	}
	// Reach Entity Attributes (JamiesWhiteShirt)
	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release/"
		name "JamiesWhiteShirt"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
}

dependencies {
	// Fabric Loom non-remap uses the ordinary project output.
	implementation(project(":common")) { transitive = false }
	
	// Bundle JLayer as a nested Fabric mod dependency; this does not relocate its packages.
	implementation("javazoom:jlayer:1.0.1") { transitive = false }
	include("javazoom:jlayer:1.0.1")

	// Skiko / Skia（轮盘 UI 平滑渲染）

	// ImGui workbench（开发/本地运行）
	
	// Fabric Loader
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Cloth Config API - 配置界面
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	
	// Cardinal Components API - Touhou Little Maid Fabric 移植版的必需传递依赖
	// Modrinth Maven 不提供传递依赖，需要手动添加
	// Cardinal Components is only needed by the deferred Maid compatibility layer.
	
	// Reach Entity Attributes - Touhou Little Maid 的传递依赖
	
	// Nashorn 脚本引擎 - Java 17 不再内置，Touhou Little Maid JS 动画需要
	runtimeOnly "org.openjdk.nashorn:nashorn-core:15.4"
	
	// TouhouLittleMaid Orihime (Fabric 移植版) - 可选依赖，用于联动
	// Touhou Little Maid compatibility is deferred for the first 26.3 milestone.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	dependsOn(":common:classes")
	from(project(":common").sourceSets.main.output)
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(project(":common").sourceSets.main.allSource)
}

sourceSets {
    main {
        java {
            exclude "**/EntityMaidRendererMixin.java" // optional Maid compatibility deferred for 26.3
            // First-person hand rendering still targets the removed ItemInHandRenderer; it is ported
            // separately from the model render backend and is not listed in mmdskin-fabric.mixins.json.
            exclude "**/ItemInHandRendererMixin.java"
            exclude "**/VivecraftVRPlayerRendererMixin.java"
        }
        resources {
            exclude 'assets/mmdskin/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
